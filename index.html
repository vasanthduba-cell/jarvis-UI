<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#7fe8ff}
canvas{position:fixed;inset:0;width:100%;height:100%}
video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
#status{display:none;z-index:10;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);letter-spacing:.3em;font-size:14px;text-shadow:0 0 10px #2bd0ff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,10,20,.82);transition:opacity .8s}
#boot .log{width:min(520px,80vw);height:150px;font-size:13px;line-height:1.7;overflow:hidden;text-shadow:0 0 6px #2bd0ff}
#bar{width:min(520px,80vw);height:8px;border:1px solid #38d0ff;margin-top:14px;box-shadow:0 0 14px #1ab8ff}
#fill{height:100%;width:0;background:linear-gradient(90deg,#0a6ea8,#7fe8ff);box-shadow:0 0 14px #38d0ff}
#pct{margin-top:10px;font-size:22px;letter-spacing:.3em}
</style></head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>
<div id="status"></div>
<div id="boot"><div class="log" id="log"></div><div id="bar"><div id="fill"></div></div><div id="pct">0%</div></div>

<script type="module">
import {FilesetResolver,FaceLandmarker,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const cv=document.getElementById('c'),mctx=cv.getContext('2d'),video=document.getElementById('v');
let ctx=mctx;
const hcv=document.createElement('canvas'),hctx=hcv.getContext('2d'),dcv=document.createElement('canvas'),dctx=dcv.getContext('2d');dcv.width=480;dcv.height=270;
const statusEl=document.getElementById('status');
let C='#38d0ff',C2='#bff4ff';
// everything except the iris ring shifts to a deeper blue while armed (bm = 0..1 armed blend)
function theme(){const mx=(u,v)=>Math.round(u+(v-u)*bm);C=`rgb(${mx(56,28)},${mx(208,112)},255)`;C2=`rgb(${mx(191,140)},${mx(244,200)},255)`}
let W,H,faceRes=null,handRes=null,face,hand,ready=false,state='booting',frame=0;

function resize(){const d=Math.min(devicePixelRatio||1,1.25);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;mctx.setTransform(d,0,0,d,0,0);hcv.width=W;hcv.height=H}
addEventListener('resize',()=>{ov=null;resize()});resize();

// ---------- setup ----------
async function make(cls,fs,url,extra){
  for(const delegate of ['GPU','CPU']){
    try{return await cls.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate},runningMode:'VIDEO',...extra})}
    catch(e){console.warn(delegate,'failed',e)}
  }
  throw new Error('model load failed');
}
async function init(){
  try{
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    await video.play();
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    face=await make(FaceLandmarker,fs,"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",{numFaces:1});
    hand=await make(HandLandmarker,fs,"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",{numHands:2});
    ready=true;
  }catch(e){statusEl.style.display='block';statusEl.textContent='ERROR: '+e.message+' (allow camera, check internet)';statusEl.style.animation='none'}
}
init();

// ---------- mapping (mirrored, cover-fit) ----------
function map(l){
  const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh);
  return [W-((W-vw*s)/2+l.x*vw*s),(H-vh*s)/2+l.y*vh*s];
}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

// ---------- drawing helpers ----------
const TAU=Math.PI*2,CONN=HandLandmarker.HAND_CONNECTIONS,TIPS=[4,8,12,16,20];
const lerp=(a,b,k)=>a+(b-a)*k,ease=a=>a*a*(3-2*a),clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function glow(b=6){ctx.shadowColor=C;ctx.shadowBlur=b;ctx.strokeStyle=C;ctx.fillStyle=C}
function arc(x,y,r,a,len,w){ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,a,a+len);ctx.stroke()}
function A(x,y,r,a,len){ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.arc(x,y,r,a,a+len)}
function text(s,x,y,size=11,align='left'){ctx.font=`${size}px 'Courier New',monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}

// static overlay (vignette + scanlines + corner brackets) rendered once per resize
let ov=null;
function buildOverlay(){
  ov=document.createElement('canvas');ov.width=W;ov.height=H;const q=ov.getContext('2d');
  const g=q.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);
  g.addColorStop(0,`rgba(0,${Math.round(30-10*bm)},${Math.round(60+40*bm)},.3)`);g.addColorStop(1,`rgba(0,${Math.round(10-4*bm)},${Math.round(30+40*bm)},.8)`);
  q.fillStyle=g;q.fillRect(0,0,W,H);
  q.fillStyle='rgba(56,208,255,.05)';for(let y=0;y<H;y+=4)q.fillRect(0,y,W,1);
  q.strokeStyle=C;q.lineWidth=2;q.globalAlpha=.8;q.beginPath();const m=24,l=40;
  for(const [x,y,sx,sy] of [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]]){
    q.moveTo(x,y+l*sy);q.lineTo(x,y);q.lineTo(x+l*sx,y)}
  q.stroke();
}

// ---------- tracking state (smoothed, with fade in/out) ----------
const ey={x:0,y:0,r:20,a:0,seen:false},par={x:0,y:0};
let battle=0,bm=0,voice='VOICE // STARTING...',rec=null,listening=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const vtxt=()=>battle?'VOICE // ARMED - SAY "STAND DOWN"':'VOICE // SAY "INITIATE"';
function listen(){
  if(!SR){voice='VOICE // UNSUPPORTED - USE CHROME';return}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
  rec.onstart=()=>{listening=true;voice=vtxt()};
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const w=e.results[i][0].transcript.toLowerCase();
    if(w.includes('initiate'))battle=1;else if(/stand down|deactivate/.test(w))battle=0}voice=vtxt()};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){voice='VOICE // MIC BLOCKED';rec.onend=null}};
  rec.onend=()=>{listening=false;setTimeout(()=>{try{rec.start()}catch(_){}},300)};
  try{rec.start()}catch(_){}
}
listen();
addEventListener('pointerdown',()=>{if(rec&&!listening)try{rec.start()}catch(_){}});
const hs=[{a:0,p:null,t:null},{a:0,p:null,t:null}];
let iT=null,lastFace=null,lastHand=null,prev=performance.now(),clock='',clockS=-2000;

function targetRing(x,y,r,t,a){
  const k=bm,mx=(u,v)=>Math.round(u+(v-u)*k),col=`rgb(${mx(56,255)},${mx(208,48)},${mx(255,48)})`,tc=`rgb(${mx(191,255)},${mx(244,220)},${mx(255,220)})`;
  const e=ease(a),R=r*(1+(1-e)*.7)*(1+.12*k);
  ctx.save();ctx.shadowColor=col;ctx.shadowBlur=7;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.globalAlpha=e;
  arc(x,y,R,0,TAU,1.5);
  for(let i=0;i<3;i++)arc(x,y,R*1.28,t*1.4+i*2.094,1.1,3);
  ctx.setLineDash([4,7]);arc(x,y,R*.78,-t*2,TAU,1.2);ctx.setLineDash([]);
  for(let i=0;i<2;i++)arc(x,y,R*1.6,-t*.8+i*Math.PI,.6,1.5);
  ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<48;i++){const q=i/48*TAU+t*.3,l=i%4?4:9;
    ctx.moveTo(x+Math.cos(q)*R*1.42,y+Math.sin(q)*R*1.42);ctx.lineTo(x+Math.cos(q)*(R*1.42+l),y+Math.sin(q)*(R*1.42+l))}
  for(let k=0;k<4;k++){const q=k*Math.PI/2,c=Math.cos(q),s=Math.sin(q);
    ctx.moveTo(x+c*R*.25,y+s*R*.25);ctx.lineTo(x+c*R*.6,y+s*R*.6);
    ctx.moveTo(x+c*R*1.85,y+s*R*1.85);ctx.lineTo(x+c*R*2.3,y+s*R*2.3)}
  ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,2.5,0,TAU);ctx.fill();
  arc(x,y,R*.45,t*2.5,4.2,1.5);
  ctx.lineWidth=1.5;ctx.beginPath();
  for(const d of [-1,1])for(let i=0;i<2;i++){const cx=x+d*(R*2.1+i*9);ctx.moveTo(cx-d*5,y-6);ctx.lineTo(cx,y);ctx.lineTo(cx-d*5,y+6)}
  ctx.stroke();
  // callout, flips to stay on screen
  const d=x+R*2.2+170>W?-1:1,ex=x+d*R*2.1,ly=y-R*1.9;
  ctx.beginPath();ctx.moveTo(x+d*R*1.15,y-R*1.15);ctx.lineTo(ex,ly);ctx.lineTo(ex+d*160,ly);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=tc;
  text(k>.5?'TARGET LOCK // ARMED':'IRIS TRACKING ACTIVE',ex+d*4,ly-6,11,d>0?'left':'right');
  ctx.globalAlpha=e*.65;text('R-EYE // LOCK',ex+d*4,ly+13,10,d>0?'left':'right');
  if(k>.02)battleFX(x,y,R,t,k*e,d,ly,col,tc);
  ctx.restore();
}

function battleFX(x,y,R,t,g,d,ly,col,tc){
  ctx.shadowColor=col;ctx.shadowBlur=4;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.globalAlpha=g;
  ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<12;i++)A(x,y,R*2.05,-t*.5+i*.5236,.36);ctx.stroke();
  ctx.beginPath();for(let i=0;i<4;i++){const q=t*.4+i*1.5708,c=Math.cos(q),s=Math.sin(q),r0=R*1.12;
    ctx.moveTo(x+c*r0,y+s*r0);ctx.lineTo(x+c*(r0+11)-s*5,y+s*(r0+11)+c*5);ctx.lineTo(x+c*(r0+11)+s*5,y+s*(r0+11)-c*5);ctx.closePath()}ctx.fill();
  ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=6;i++){const q=t*.25+i*1.0472,px=x+Math.cos(q)*R*2.35,py=y+Math.sin(q)*R*2.35;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();
  const bs=R*(2.7+.12*Math.sin(t*4)),bl=R*.45;ctx.lineWidth=2.5;ctx.beginPath();
  for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.moveTo(x+sx*bs,y+sy*(bs-bl));ctx.lineTo(x+sx*bs,y+sy*bs);ctx.lineTo(x+sx*(bs-bl),y+sy*bs)}ctx.stroke();
  ctx.lineWidth=1;ctx.globalAlpha=g*.5;ctx.beginPath();
  for(const sg of [-1,1]){ctx.moveTo(x+sg*R*2.9,y);ctx.lineTo(x+sg*R*4.6,y);ctx.moveTo(x,y+sg*R*2.9);ctx.lineTo(x,y+sg*R*4.6);
    for(let i=0;i<8;i++){const o=R*(2.9+i*.22),h=i%2?4:8;ctx.moveTo(x+sg*o,y-h);ctx.lineTo(x+sg*o,y+h);ctx.moveTo(x-h,y+sg*o);ctx.lineTo(x+h,y+sg*o)}}
  ctx.stroke();
  const a=t*3;ctx.globalAlpha=g*.16;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,R*.78,a-.9,a);ctx.closePath();ctx.fill();
  ctx.globalAlpha=g;for(let i=0;i<3;i++){const q=-t*.9+i*2.094,px=x+Math.cos(q)*R*1.75,py=y+Math.sin(q)*R*1.75;ctx.beginPath();ctx.moveTo(px,py-5);ctx.lineTo(px+5,py);ctx.lineTo(px,py+5);ctx.lineTo(px-5,py);ctx.closePath();ctx.fill()}
  const pp=(t*.8)%1;ctx.globalAlpha=g*(1-pp)*.8;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,R*(1+pp*2.4),0,TAU);ctx.stroke();
  // extra detail: dense tick rings, counter-rotating arcs, lock-progress gauge, spinning square, radar line
  ctx.globalAlpha=g*.8;ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<90;i++){const q=i/90*TAU-t*.35,c=Math.cos(q),s=Math.sin(q),l=i%6?3:7,r0=R*.64;ctx.moveTo(x+c*r0,y+s*r0);ctx.lineTo(x+c*(r0+l),y+s*(r0+l))}
  for(let i=0;i<72;i++){const q=i/72*TAU+t*.12,c=Math.cos(q),s=Math.sin(q),l=i%6?4:10,r0=R*2.5;ctx.moveTo(x+c*r0,y+s*r0);ctx.lineTo(x+c*(r0+l),y+s*(r0+l))}
  ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<24;i++)A(x,y,R*1.9,t*.7+i*.2618,.13);ctx.stroke();
  for(let i=0;i<3;i++)arc(x,y,R*2.2,-t*1.1+i*2.094,.9,2);
  ctx.setLineDash([2,6]);arc(x,y,R*1.4,-t*.6,TAU,1);ctx.setLineDash([]);
  arc(x,y,R*1.2,-Math.PI/2,TAU*(.72+.25*Math.sin(t*.9)),4);
  ctx.lineWidth=1.2;ctx.beginPath();const sq=R*.75,cr=Math.cos(t*.5),sr=Math.sin(t*.5);
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([u,v],i)=>{const px=x+(u*cr-v*sr)*sq,py=y+(u*sr+v*cr)*sq;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();ctx.stroke();
  ctx.globalAlpha=g*.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(t*1.6)*R*2.35,y+Math.sin(t*1.6)*R*2.35);ctx.stroke();
  ctx.globalAlpha=g;for(let i=0;i<6;i++){const q=t*.25+i*1.0472;ctx.strokeRect(x+Math.cos(q)*R*2.35-3,y+Math.sin(q)*R*2.35-3,6,6)}
  ctx.shadowBlur=0;ctx.fillStyle=tc;ctx.globalAlpha=g*.9;
  const tx=x+d*(R*3.1+10),al=d>0?'left':'right';
  [`RNG ${String(380+Math.round(30*Math.sin(t*.7))).padStart(4,'0')}M`,`VEL ${String(45+Math.round(4*Math.sin(t))).padStart(3,'0')}KT`,`THRT LVL ${3+Math.floor(t)%5}`,'WPN SYS // ARMED',`ACQ ${(97+2*Math.sin(t*1.3)).toFixed(1)}%`].forEach((q,i)=>text(q,tx,ly+31+i*14,10,al));
  ctx.globalAlpha=g*.7;['000','090','180','270'].forEach((q,i)=>{const a=i*Math.PI/2-Math.PI/2;text(q,x+Math.cos(a)*R*2.72,y+Math.sin(a)*R*2.72+3,9,'center')});ctx.globalAlpha=g*.9;
  if(Math.floor(t*3)%2){ctx.strokeStyle=col;ctx.lineWidth=1.5;const bx=d>0?tx:tx-84;ctx.strokeRect(bx,ly+104,84,18);text('LOCKED',bx+42,ly+117,12,'center')}
}

function handFX(h,i,t){
  const p=h.p,e=ease(h.a),k=1+(1-e)*.8;
  ctx.save();glow(5);
  ctx.globalAlpha=e*.5;ctx.lineWidth=1.2;ctx.beginPath();
  for(const {start,end} of CONN){ctx.moveTo(p[start][0],p[start][1]);ctx.lineTo(p[end][0],p[end][1])}
  ctx.stroke();
  const c=[0,5,9,13,17].reduce((s,n)=>[s[0]+p[n][0]/5,s[1]+p[n][1]/5],[0,0]),r=Math.max(dist(p[0],p[9])*.5,20)*k;
  ctx.globalAlpha=e;ctx.lineWidth=2;ctx.beginPath();
  TIPS.forEach((q,n)=>{const a=t*2+n;A(p[q][0],p[q][1],13*k,a,1.6);A(p[q][0],p[q][1],13*k,a+Math.PI,1.6)});
  for(let j=0;j<3;j++)A(c[0],c[1],r,t*(i?-1:1)+j*2.094,1.2);
  ctx.stroke();
  ctx.beginPath();
  TIPS.forEach(q=>{const x=p[q][0],y=p[q][1],b=p[q-1],d=Math.atan2(y-b[1],x-b[0]);
    ctx.moveTo(x+2.5,y);ctx.arc(x,y,2.5,0,TAU);
    ctx.moveTo(x+Math.cos(d)*30,y+Math.sin(d)*30);
    ctx.lineTo(x+Math.cos(d+.28)*21,y+Math.sin(d+.28)*21);ctx.lineTo(x+Math.cos(d-.28)*21,y+Math.sin(d-.28)*21);ctx.closePath()});
  ctx.moveTo(c[0]+3,c[1]);ctx.arc(c[0],c[1],3,0,TAU);ctx.fill();
  ctx.setLineDash([3,6]);arc(c[0],c[1],r*1.25,-t,TAU,1);ctx.setLineDash([]);
  ctx.shadowBlur=0;ctx.fillStyle=C2;ctx.globalAlpha=e*.85;
  text(`HAND 0${i+1} // TRACKING`,Math.min(c[0]+r*1.4,W-160),c[1]-r*.4,10);
  ctx.restore();
}

// ---------- HUD panels (film-style overlays around the face) ----------
function hud(t){
  // virtual layout is at least 1470x956, scaled uniformly so everything fits with a safe margin
  const S=clamp(Math.min(innerWidth/1470,innerHeight/956),.4,1.6),W=innerWidth/S,H=innerHeight/S,m=80,on=state==='online',e=on?1:.35;
  ctx.save();ctx.scale(S,S);glow(0);ctx.globalAlpha=.85*e;
  const box=(x,y,w,h,s)=>{ctx.lineWidth=1.2;ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;ctx.fillStyle=C2;text(s,x+w/2,y+h/2+4,12,'center');glow(0)};
  const ring=(x,y,r,t,n)=>{ctx.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU+t,l=i%3?5:11;ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.lineTo(x+Math.cos(a)*(r+l),y+Math.sin(a)*(r+l))}ctx.lineWidth=1;ctx.stroke()};

  const ox=par.x/S,oy=par.y/S,L=(k,ax,ay,sk)=>{ctx.save();ctx.translate(ox*k,oy*k);if(sk){ctx.translate(ax,ay);ctx.transform(1,sk,0,1,0,0);ctx.translate(-ax,-ay)}glow(0);ctx.globalAlpha=.85*e};
  // ===== LEFT COLUMN =====
  box(m,110,58,26,String(18+Math.floor(t/3)%9).padStart(2,'0'));box(m+68,110,58,26,String(15+Math.floor(t/2)%9).padStart(2,'0'));
  L(.06,m+95,H*.5,-.03);
  ctx.shadowBlur=0;ctx.fillStyle=C2;
  for(let i=0;i<8;i++){ctx.globalAlpha=(.3+.5*i/8)*e;const k=Math.floor(t*3)+i;
    text((Math.imul(k,2654435761)>>>0).toString(16).toUpperCase().padStart(8,'0')+'  '+(((Math.imul(k+7,40503)>>>0)&255).toString(16).toUpperCase().padStart(2,'0')),m,176+i*16,10)}
  ctx.globalAlpha=.85*e;glow(0);
  const lx=m+95,ly=H*.5,b=90;
  for(let i=0;i<5;i++){const r=b*(1-i*.17),d=i%2?-1:1;
    ctx.beginPath();A(lx,ly,r,d*t*.5+i,1.5);A(lx,ly,r,d*t*.5+i+3.4,1.1);ctx.lineWidth=2.6-i*.4;ctx.stroke()}
  ctx.setLineDash([3,8]);arc(lx,ly,b*1.15,t*.3,TAU,1);ctx.setLineDash([2,5]);arc(lx,ly,b*.28,-t,TAU,1);ctx.setLineDash([]);
  ring(lx,ly,b*1.28,t*.1,36);
  ctx.shadowBlur=0;ctx.fillStyle=C2;text(String(Math.round(60+30*Math.sin(t*.5))),lx,ly+5,16,'center');glow(0);
  ctx.beginPath();for(let i=0;i<=50;i++){const x=m+i*5,y=640+Math.sin(t*3+i*.4)*10*Math.sin(t+i*.15)+Math.sin(i*1.7+t*5)*4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.moveTo(m,660);ctx.lineTo(m+250,660);ctx.globalAlpha=.4*e;ctx.stroke();ctx.globalAlpha=.85*e;
  ctx.restore();
  L(.04,m,H-m,0);
  // circle grid, icons, ribbon
  const gx=m,gb=H-m;
  for(let r=0;r<4;r++)for(let c=0;c<6;c++){
    ctx.globalAlpha=(.3+.65*Math.abs(Math.sin(t*1.2+c*.7+r*1.3)))*e;
    ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(gx+8+c*22+(r%2)*11,gb-150+r*20,7,0,TAU);ctx.stroke()}
  ctx.globalAlpha=.85*e;
  for(let i=0;i<4;i++){const cx=gx+12+i*32;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,gb-12,10-(i>1?2:0),0,TAU);ctx.stroke();
    if(i>1){ctx.beginPath();ctx.arc(cx,gb-12,4,0,TAU);ctx.fill()}}
  ctx.beginPath();ctx.moveTo(gx,gb-48);ctx.lineTo(gx+400,gb-48);ctx.lineWidth=1;ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=C2;text('TARGETING SUBSYSTEM // ACTIVE',gx,gb-56,15);glow(0);

  ctx.restore();
  // ===== RIGHT COLUMN =====
  L(.08,W-m-150,235,.05);
  // top reticle cluster
  const cx=W-m-150,cy=235,R=60;
  arc(cx,cy,R,0,TAU,1.5);
  for(let i=0;i<3;i++)arc(cx,cy,R*1.25,t*1.2+i*2.094,1.1,3);
  ctx.setLineDash([4,7]);arc(cx,cy,R*.8,-t*1.6,TAU,1.2);ctx.setLineDash([]);
  for(let i=0;i<2;i++)arc(cx,cy,R*1.55,-t*.7+i*Math.PI,.7,1.5);
  arc(cx,cy,R*.28,0,TAU,1.5);ring(cx,cy,R*1.4,t*.3,48);
  ctx.beginPath();for(let k=0;k<4;k++){const q=k*Math.PI/2,c=Math.cos(q),s2=Math.sin(q);ctx.moveTo(cx+c*R*.1,cy+s2*R*.1);ctx.lineTo(cx+c*R*.5,cy+s2*R*.5)}ctx.lineWidth=1;ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=C2;text('<',cx-R*1.85,cy+4,14);text('>',cx+R*1.72,cy+4,14);glow(0);
  box(cx+R*1.6,cy-R*1.3,34,20,'6x');box(cx+R*1.6,cy+R*1.0,34,20,'4x');
  ctx.restore();
  L(.06,W-m,H*.5,.04);
  // ruler with ladder numbers + marker
  const rx=W-m,top=H*.4,hh=H*.22,my=top+hh*(.5+.38*Math.sin(t*.6));
  ctx.beginPath();ctx.moveTo(rx,top);ctx.lineTo(rx,top+hh);
  for(let y=0;y<=hh;y+=8){const l=y%40?6:14;ctx.moveTo(rx,top+y);ctx.lineTo(rx-l,top+y)}
  ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(rx+4,my);ctx.lineTo(rx+14,my-6);ctx.lineTo(rx+14,my+6);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle=C2;ctx.globalAlpha=.6*e;
  for(let y=0;y<=hh;y+=40)text(String(90-Math.round(y/40)*10),rx-20,top+y+3,9,'right');
  ctx.globalAlpha=.85*e;glow(0);
  // readout stack
  for(let i=0;i<3;i++){const x=W-m-330,y=H*.4+i*52,pc=Math.round(93+5*Math.sin(t*.7+i*2)),n=Math.round(pc/100*14);
    ctx.beginPath();ctx.moveTo(x,y+28);ctx.lineTo(x+120,y+28);ctx.lineTo(x+134,y+14);ctx.lineWidth=1.5;ctx.stroke();
    for(let k=0;k<14;k++){ctx.globalAlpha=(k<n?.9:.2)*e;ctx.fillRect(x+150+k*6,y+6,4,20)}
    ctx.globalAlpha=.85*e;ctx.shadowBlur=0;ctx.fillStyle=C2;
    ctx.globalAlpha=.6*e;text(['SHLD','PWR','SENS'][i]+' // MAIN',x+4,y+8,10);
    ctx.globalAlpha=.9*e;text(pc+'% FULL',x+4,y+23,15);text('<',x+150+14*6+8,y+22,14);glow(0)}
  ctx.restore();
  L(.04,W-m-140,H-m-130,0);
  // compass dial
  const dx=W-m-140,dy=H-m-130,dr=125,hd=(t*8)%360;glow(0);ctx.globalAlpha=.85*e;
  for(let i=0;i<8;i++)arc(dx,dy,dr,i*TAU/8+.05,TAU/8-.1,i%3?1.5:3);
  ctx.beginPath();for(let i=0;i<72;i++){const q=i/72*TAU-Math.PI/2-hd*TAU/360,l=i%6?4:9;ctx.moveTo(dx+Math.cos(q)*(dr-14),dy+Math.sin(q)*(dr-14));ctx.lineTo(dx+Math.cos(q)*(dr-14-l),dy+Math.sin(q)*(dr-14-l))}
  ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(dx,dy-dr+2);ctx.lineTo(dx-6,dy-dr-8);ctx.lineTo(dx+6,dy-dr-8);ctx.closePath();ctx.fill();
  for(let i=0;i<44;i++){const q=-1.4+i*.075,r0=dr*.64,l=5+16*Math.abs(Math.sin(t*.9+i*.5)),hi=i%9===4;
    ctx.strokeStyle=hi?C2:C;ctx.lineWidth=hi?3:2.2;ctx.beginPath();ctx.moveTo(dx+Math.cos(q)*r0,dy+Math.sin(q)*r0);ctx.lineTo(dx+Math.cos(q)*(r0+l),dy+Math.sin(q)*(r0+l));ctx.stroke()}
  ctx.strokeStyle=C;
  arc(dx,dy,dr*.56,0,TAU,2);ctx.setLineDash([2,4]);arc(dx,dy,dr*.5,t*.5,TAU,1);ctx.setLineDash([]);
  ring(dx,dy,dr*.4,-t*.2,48);arc(dx,dy,dr*.3,0,TAU,1.5);
  ctx.beginPath();for(let k=0;k<3;k++){const q=-Math.PI/2+k*2.094;ctx.moveTo(dx,dy);ctx.lineTo(dx+Math.cos(q)*dr*.3,dy+Math.sin(q)*dr*.3)}ctx.lineWidth=2.5;ctx.stroke();
  arc(dx,dy,dr*.1,0,TAU,2);
  ctx.beginPath();ctx.moveTo(dx-dr,dy);ctx.lineTo(dx-dr*.6,dy);ctx.moveTo(dx+dr*.6,dy);ctx.lineTo(dx+dr,dy);ctx.lineWidth=1;ctx.globalAlpha=.4*e;ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=C2;ctx.globalAlpha=.9*e;text('N',dx,dy-dr-14,12,'center');text(String(Math.floor(hd)).padStart(3,'0')+' KNOTS',dx-dr,dy-dr-14,12);
  ctx.restore();
  L(.02,W/2,100,0);
  // ONLINE plate (top centre)
  glow(0);ctx.globalAlpha=.3*e;ctx.fillRect(W/2-130,74,260,34);ctx.globalAlpha=.85*e;ctx.lineWidth=1;ctx.strokeRect(W/2-130,74,260,34);
  ctx.shadowBlur=0;ctx.fillStyle=C2;text('ONLINE',W/2,100,24,'center');ctx.globalAlpha=.6*e;text('SUPPORT SYSTEMS OPERATIONAL',W/2,68,9,'center');
  ctx.globalAlpha=.9*e;text('SYSTEM ONLINE',W/2,124,13,'center');ctx.globalAlpha=.6*e;
  ctx.restore();
  extra(t,S,W,H,m,e,L,ring);
  ctx.shadowBlur=0;ctx.fillStyle=C2;ctx.globalAlpha=.6*e;
  ['ALT '+(400+Math.round(12*Math.sin(t*.3)))+'M','VEL '+String(45+Math.round(3*Math.sin(t))).padStart(3,'0')+'KT','BRG '+String(Math.floor((t*8)%360)).padStart(3,'0'),'TMP '+(21+Math.round(Math.sin(t*.2)))+'C'].forEach((q,i)=>text(q,W-34,76+i*14,10,'right'));
  text('RT 68',34,76,10);text('AUX '+(Math.floor(t)%60+'').padStart(2,'0'),100,76,10);
  ctx.restore();
}

// ---------- extra layers: denser, more film-like composition (all blue palette, follows C / C2 theme) ----------
function extra(t,S,W,H,m,e,L,ring){
  const cap=(x,y,w,h,q,sz=12)=>{ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,h/2):ctx.rect(x,y,w,h);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=C2;text(q,x+w/2,y+h/2+4,sz,'center');glow(0)};
  // top capsules
  L(.03,W/2,0,0);
  cap(250,34,112,26,'68 x RT');cap(W-290,34,130,26,`${3+Math.floor(t/4)%6} | ${12+Math.floor(t/2)%9}`);
  ctx.restore();
  // cropped big ring on the left edge + translucent backing and vertical label beside the hex readout
  L(.05,0,H*.5,0);ctx.globalAlpha=.55*e;
  for(let i=0;i<5;i++){const r=70+i*24,d=i%2?-1:1;ctx.beginPath();A(-60,H*.5,r,d*t*.3+i,1.9);A(-60,H*.5,r,d*t*.3+i+3.6,1.3);ctx.lineWidth=3-i*.4;ctx.stroke()}
  ring(-60,H*.5,190,t*.05,60);ctx.setLineDash([2,6]);arc(-60,H*.5,58,t*.4,TAU,1);ctx.setLineDash([]);
  ctx.globalAlpha=.07*e;ctx.fillRect(m-10,160,190,140);
  ctx.globalAlpha=.6*e;ctx.save();ctx.translate(m+205,300);ctx.rotate(-Math.PI/2);ctx.shadowBlur=0;ctx.fillStyle=C2;text('MICRO-ARRAY // GUIDANCE',0,0,10);ctx.restore();glow(0);
  ctx.restore();
  // cropped big ring in the top-right corner
  L(.05,W,0,0);ctx.globalAlpha=.5*e;
  for(let i=0;i<4;i++){const r=150+i*34,d=i%2?-1:1;ctx.beginPath();A(W+10,-10,r,d*t*.2+i,1.6);A(W+10,-10,r,d*t*.2+i+3.2,1.2);ctx.lineWidth=2.4-i*.4;ctx.stroke()}
  ring(W+10,-10,320,-t*.04,72);ctx.restore();
  // tilted glowing banner across the lower-left (like the guided-projectile line)
  L(.04,m,H*.735,-.09);ctx.globalAlpha=.95*e;
  ctx.shadowColor=C;ctx.shadowBlur=8;ctx.fillStyle=C2;text('GUIDED TRACKING ARRAY // SECTOR '+(7+Math.floor(t/3)%3),m-30,H*.735,21);
  glow(0);ctx.beginPath();ctx.moveTo(m-30,H*.735+9);ctx.lineTo(m+470,H*.735+9);ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(m-30,H*.735+3);ctx.lineTo(m-30,H*.735+15);ctx.moveTo(m+470,H*.735+3);ctx.lineTo(m+470,H*.735+15);ctx.stroke();
  ctx.restore();
  // right: pill + mini bar cluster
  L(.06,W-m-330,H*.62,.04);
  cap(W-m-330,H*.62,86,24,'630');
  for(let i=0;i<4;i++){const y=H*.62+40+i*16,n=8+Math.round(5*Math.abs(Math.sin(t*.8+i)));
    for(let k=0;k<14;k++){ctx.globalAlpha=(k<n?.85:.2)*e;ctx.fillRect(W-m-330+k*6,y,4,9)}}
  ctx.restore();
  // small cross marks + dotted leader from the iris ring to the top-right reticle
  ctx.globalAlpha=.5*e;glow(0);ctx.lineWidth=1;ctx.beginPath();
  for(const [px,py] of [[m+240,150],[W-m-60,150],[W-m-420,H*.55],[m+300,H*.6]]){ctx.moveTo(px-5,py);ctx.lineTo(px+5,py);ctx.moveTo(px,py-5);ctx.lineTo(px,py+5)}
  ctx.stroke();
  if(ey.seen&&ey.a>.05){ctx.globalAlpha=.4*ey.a*e;ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(ey.x/S,ey.y/S);ctx.lineTo(W-m-150-40,235+20);ctx.stroke();ctx.setLineDash([])}
}

// ---------- main loop ----------
let lastVT=-1,lastHud=-99,obm=0;
function loop(now){
  requestAnimationFrame(loop);
  const t=now/1000,dt=Math.min((now-prev)/1000,.1);prev=now;
  theme();if(Math.abs(bm-obm)>.04){obm=bm;ov=null}
  if(video.videoWidth){
    const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh);
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
    ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s);ctx.restore();
    if(ready&&video.currentTime!==lastVT){
      lastVT=video.currentTime;const ts=performance.now();
      const dh=Math.round(480*vh/vw);if(dcv.height!==dh)dcv.height=dh;dctx.drawImage(video,0,0,480,dh);
      try{(frame++&1)?(handRes=hand.detectForVideo(dcv,ts)):(faceRes=face.detectForVideo(dcv,ts))}catch(e){}
    }
  }else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  if(!ov)buildOverlay();
  ctx.drawImage(ov,0,0,W,H);

  par.x=lerp(par.x,ey.seen?clamp(ey.x-W/2,-350,350):0,.06);par.y=lerp(par.y,ey.seen?clamp(ey.y-H/2,-350,350):0,.06);
  if(now-lastHud>33){lastHud=now;ctx=hctx;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);hud(t);ctx=mctx}
  mctx.drawImage(hcv,0,0,W,H);


  // header (text only; clock refreshed once a second)
  ctx.fillStyle=C2;
  text(state==='online'?'J.A.R.V.I.S. // ONLINE':'J.A.R.V.I.S. // STANDBY',34,54,14);
  if(state==='online'){if(now-clockS>1000){clock=new Date().toLocaleTimeString();clockS=now}text(clock,W-34,54,14,'right')}
  ctx.globalAlpha=.6;text(voice,34,96,10);ctx.globalAlpha=1;

  // new detection results -> screen-space targets (mapped once per result, not per frame)
  if(faceRes!==lastFace){
    lastFace=faceRes;const f=faceRes?.faceLandmarks?.[0];
    if(f&&f.length>468){
      iT={...map(f[468]),r:Math.max(14,dist(map(f[33]),map(f[133]))*.8)};
    }else iT=null;
  }
  if(handRes!==lastHand){
    lastHand=handRes;const L=handRes?.landmarks||[];
    for(let i=0;i<2;i++)hs[i].t=L[i]?L[i].map(map):null;
  }

  bm=lerp(bm,battle,1-Math.exp(-dt*5));
  // iris ring (smoothed, fades in/out, only while the eye is detected)
  const present=!!iT,kf=1-Math.exp(-dt*14),ke=Math.min(kf*1.4,1);
  if(iT){
    if(!ey.seen){ey.x=iT[0];ey.y=iT[1];ey.r=iT.r;ey.seen=true}
    else{ey.x=lerp(ey.x,iT[0],ke);ey.y=lerp(ey.y,iT[1],ke);ey.r=lerp(ey.r,iT.r,kf)}
  }
  ey.a=clamp(ey.a+(present?dt*3.5:-dt*3));
  if(!present&&ey.a<=0)ey.seen=false;
  if(ey.seen&&ey.a>.02)targetRing(ey.x,ey.y,ey.r,t,ey.a);

  // hands (smoothed, fade in/out)
  const kh=1-Math.exp(-dt*22);
  for(let i=0;i<2;i++){
    const s=hs[i];
    if(s.t){
      if(!s.p||dist(s.p[9],s.t[9])>160)s.p=s.t.map(q=>q.slice());
      else for(let j=0;j<21;j++){s.p[j][0]=lerp(s.p[j][0],s.t[j][0],kh);s.p[j][1]=lerp(s.p[j][1],s.t[j][1],kh)}
      s.a=clamp(s.a+dt*5);
    }else s.a=clamp(s.a-dt*4);
    if(s.a>.02&&s.p)handFX(s,i,t);
  }
}
requestAnimationFrame(loop);

// ---------- boot sequence (auto) ----------
const boot=document.getElementById('boot'),log=document.getElementById('log'),fill=document.getElementById('fill'),pct=document.getElementById('pct');
const lines=['INITIALIZING CORE SYSTEMS','CALIBRATING OPTICAL SENSORS','LOADING NEURAL INTERFACE','SYNCING BIOMETRIC TRACKING','ESTABLISHING SECURE LINK','RUNNING DIAGNOSTICS','ALL SYSTEMS READY'];
const start=performance.now(),dur=5000;let shown=0,waited=false;
function done(){log.innerHTML+='> WELCOME BACK.';setTimeout(()=>{boot.style.opacity=0;state='online';setTimeout(()=>boot.style.display='none',800)},700)}
(function step(now){
  const p=Math.min((now-start)/dur,1);
  fill.style.width=p*100+'%';pct.textContent=Math.floor(p*100)+'%';
  while(shown<lines.length&&p>=shown/lines.length){log.innerHTML+=`> ${lines[shown]} ... <b>OK</b><br>`;shown++}
  if(p<1)requestAnimationFrame(step);
  else(function w(){if(ready)done();else{if(!waited){log.innerHTML+='> WAITING FOR VISION MODULES...<br>';waited=true}setTimeout(w,200)}})();
})(start);
</script>
